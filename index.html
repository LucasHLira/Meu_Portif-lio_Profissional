    <!-- Texto para quem não roda JavaScript (robôs de IA): quem roda JS não vê, e o React troca ao montar -->
    <style>.js .conteudo-estatico { display: none; }</style>
    <!-- Aplica o tema antes do primeiro paint para evitar flash de cor -->
    <script>
      (function () {
        document.documentElement.classList.add('js');
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('portfolio-theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
          else if (window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
